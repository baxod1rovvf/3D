<!doctype html>
<html lang="uz">
<head>
<title>Xush kelibsiz — Oila Uchun</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<style>
  .auth { flex: 1; overflow-y: auto; padding: calc(40px + var(--safe-t)) 22px 28px; display: flex; flex-direction: column; animation: page-in var(--t) var(--ease) both; }
  .brand { text-align: center; margin-bottom: 26px; }
  .brand svg { width: 64px; height: 64px; margin: 0 auto 14px; }
  .brand h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 32px; letter-spacing: -.01em; }
  .brand p { margin: 6px 0 0; color: var(--muted); }
  .who { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .who button { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 10px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); font-weight: 600; transition: transform var(--t-fast); }
  .who button:active { transform: scale(.97); }
  .who .avatar { width: 56px; height: 56px; font-size: 22px; }
  .foot-note { margin-top: auto; padding-top: 24px; text-align: center; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .foot-note svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="auth">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#2F2A25"/><path d="M14 36c4 9 12 14 18 14s14-5 18-14" fill="none" stroke="#E8C9A8" stroke-width="3.2" stroke-linecap="round"/><path d="M17 40c5 4 10 5 15 5s10-1 15-5" fill="none" stroke="#B8664A" stroke-width="3.2" stroke-linecap="round"/><circle cx="27" cy="31" r="5.5" fill="#FFF3E6"/><circle cx="37.5" cy="30" r="6.5" fill="#F3DCC4"/></svg>
      <h1>Oila Uchun</h1>
      <p>Ikkingiz uchun bitta raqamli uy</p>
    </div>
    <div id="view"></div>
    <div class="foot-note"><i data-lucide="lock"></i>Ma'lumotlaringizni faqat ikkingiz ko'rasiz</div>
  </div>
</div>

<script>
const { $, $$, esc, icons } = App;
const view = $("#view");
const OFFLINE = "Ulanib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring.";

/* ---------- First phone: set up the family ---------- */
function setupView() {
  view.innerHTML = `<form id="f" novalidate>
      <div class="field"><label for="w-name">Xotinning ismi</label><input class="input" id="w-name" name="wife" autocomplete="off" maxlength="30" required></div>
      <div class="field"><label for="h-name">Erning ismi</label><input class="input" id="h-name" name="husband" autocomplete="off" maxlength="30" required></div>
      <div class="field"><label for="f-name">Oila nomi</label><input class="input" id="f-name" name="family" value="Bizning uy" maxlength="40"></div>
      <p class="error-text" id="err" hidden></p>
      <button class="btn primary block" type="submit">Oilani boshlash</button>
    </form>
    <div style="display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--muted);font-size:13px"><span style="flex:1;height:1px;background:var(--line)"></span>yoki<span style="flex:1;height:1px;background:var(--line)"></span></div>
    <button class="btn ghost block" id="have-code"><i data-lucide="keyboard"></i>Menda kod bor</button>
    <p class="hint" style="text-align:center;margin-top:8px">Juftingiz oilani allaqachon boshlagan bo'lsa, uning telefonidagi kodni kiriting.</p>`;
  const f = $("#f", view), err = $("#err", view);
  $("#have-code", view).addEventListener("click", codeView);
  icons();
  f.addEventListener("submit", async (e) => {
    e.preventDefault(); err.hidden = true;
    const wifeName = f.elements.wife.value.trim(), husbandName = f.elements.husband.value.trim();
    if (!wifeName || !husbandName) { err.textContent = "Ikkalangizning ismingizni yozing."; err.hidden = false; return; }
    const btn = f.querySelector("button[type=submit]"); btn.disabled = true;
    try { await Store.createFamily({ wifeName, husbandName, familyName: f.elements.family.value.trim() || "Bizning uy" }); shareView(); }
    catch (ex) { console.error(ex); err.textContent = OFFLINE; err.hidden = false; btn.disabled = false; }
  });
}

/* ---------- After setup: connect the partner's phone with a code ---------- */
function shareView() {
  view.innerHTML = `<div class="card" style="padding:16px">
      <div class="empty" style="padding:4px 0 0"><div class="ico" style="background:var(--sage-soft);color:var(--sage);border:0"><i data-lucide="check"></i></div>
      <strong>Oila tayyor!</strong><p>Endi juftingiz telefonini ulang: u <b>«Menda kod bor»</b>ni bosib, shu kodni kiritadi.</p></div>
      <div id="code-box"></div>
    </div>
    <button class="btn primary block" id="next" style="margin-top:12px">Davom etish</button>
    <p class="hint" style="text-align:center;margin-top:8px">Keyinroq ham ulash mumkin: Sozlamalar → «Qurilmani ulash».</p>`;
  App.showPairCode($("#code-box", view));
  $("#next", view).addEventListener("click", () => route());
  icons();
}

/* ---------- Second phone: enter the partner's code ---------- */
function codeView() {
  view.innerHTML = `<div id="code-form"></div>
    <button class="link-btn" id="back" style="display:block;margin:16px auto 0">Yangi oila boshlash</button>`;
  App.enterPairCode({ inline: $("#code-form", view), onJoined: () => route() });
  $("#back", view).addEventListener("click", setupView);
}

/* ---------- Each phone, once: who is holding it? ---------- */
function whoView(ctx) {
  const members = [...ctx.members].sort((a, b) => (a.role === "xotin" ? -1 : b.role === "xotin" ? 1 : 0));
  view.innerHTML = `<p style="text-align:center;margin:0 0 14px"><b>${esc(ctx.household.name)}</b> — bu telefon kimniki?</p>
    <div class="who">${members.map((m) => `<button data-id="${m.id}">${App.avatar(m)}${esc(m.full_name)}<span class="small muted" style="font-weight:400">${m.role === "er" ? "Er" : "Xotin"}</span></button>`).join("")}</div>
    <p class="hint" style="text-align:center;margin-top:18px">Telefon buni eslab qoladi — keyin bu savol berilmaydi.</p>
    ${Store.mode === "demo" ? `<p class="hint" style="text-align:center">Demo rejim: ma'lumotlar faqat shu brauzerda. Ikki telefonni ulash uchun js/config.js ga Supabase manzili va kalitini yozing.</p>` : ""}`;
  $$("[data-id]", view).forEach((b) => b.addEventListener("click", () => { Store.chooseMe(b.dataset.id); location.href = "index.html"; }));
}

async function route() {
  // Opened from a family link: remember the key, then drop it from the address bar.
  const fromLink = (location.hash.match(/k=([\w-]+)/) || [])[1];
  if (fromLink) history.replaceState(null, "", location.pathname);
  let ctx = null;
  try {
    if (fromLink && !(await Store.joinFamily(fromLink))) {
      view.innerHTML = `<div class="empty"><div class="ico"><i data-lucide="link-2-off"></i></div><strong>Havola ishlamadi</strong><p>Bu havola bilan oila topilmadi. Juftingizdan havolani qayta so'rang.</p><button class="btn ghost" onclick="setupView()">Bosh sahifa</button></div>`;
      return icons();
    }
    ctx = await Store.session();
  } catch (e) {
    console.error(e);
    view.innerHTML = `<div class="empty"><div class="ico"><i data-lucide="wifi-off"></i></div><strong>Ulanib bo'lmadi</strong><p>Internetni tekshirib, qayta urinib ko'ring.</p><button class="btn primary" onclick="location.reload()">Qayta urinish</button></div>`;
    return icons();
  }
  if (!ctx) setupView();
  else if (!ctx.profile) whoView(ctx);
  else location.replace("index.html");
  icons();
}
window.setupView = setupView;
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
