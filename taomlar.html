<!doctype html>
<html lang="uz">
<head>
<title>Taomlar menyusi — Oila Uchun</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="js/config.js"></script>
<script src="js/stickers.js"></script>
<script src="js/catalog.js"></script>
<script src="js/messages.js"></script>
<script src="js/reminders.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<style>
  .weeknav { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
  .weeknav .label { flex: 1; text-align: center; font-family: var(--display); font-weight: 600; font-size: 17px; }
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .day { border: 2px solid transparent; background: var(--surface); border-radius: 16px; padding: 7px 0 6px; min-height: 64px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-2); transition: background var(--t) var(--ease), transform var(--t-fast) var(--bounce); }
  .day:active { transform: scale(.94); }
  .day .wd { font-size: 11.5px; font-weight: 800; color: var(--muted); }
  .day .dn { font-size: 18px; font-weight: 600; font-family: var(--display); }
  .day .dots { display: flex; gap: 2px; height: 5px; }
  .day .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
  .day .dots i.f { background: var(--accent); }
  .day.today { border-color: var(--accent); }
  .day.today .dn { color: var(--accent-ink); }
  .day.active { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-deep); }
  .day.active .wd, .day.active .dn { color: var(--on-accent); }
  .day.active .dots i { background: rgba(43, 36, 64, .25); }
  .day.active .dots i.f { background: var(--on-accent); }

  .slot { margin-top: 12px; padding: 14px; }
  .slot-h { display: flex; align-items: center; gap: 10px; }
  .slot-h .si { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; font-size: 22px; line-height: 1; }
  .slot-h .sl { flex: 1; font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink); }
  .meal { margin-top: 10px; padding-top: 10px; border-top: 2px dashed var(--line-2); cursor: pointer; }
  .meal:first-of-type { border-top: 0; padding-top: 0; }
  .meal h4 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 20px; display: flex; align-items: center; gap: 6px; }
  .meal h4 svg { width: 16px; height: 16px; color: var(--honey); fill: var(--honey); flex: none; }
  .meal p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
  .ings { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip.ing { background: var(--accent-soft); border-color: transparent; color: var(--ink); padding: 3px 10px 3px 4px; font-size: 12.5px; }
  .chip.ing .emo { width: 22px; height: 22px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 13px; }
  .add-slot { margin-top: 10px; width: 100%; min-height: 48px; border: 2px dashed var(--accent); border-radius: 16px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .add-slot svg { width: 16px; height: 16px; }

  .ing-edit { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .ing-edit .chip { padding: 3px 2px 3px 4px; font-size: 13px; }
  .ing-edit .chip button { border: 0; background: none; width: 32px; height: 32px; padding: 0; display: grid; place-items: center; color: var(--ink-2); }
  .ing-add { display: flex; gap: 8px; }
  .ing-add .input { flex: 1; }

  .pick { display: flex; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 2px solid var(--line); min-height: 56px; font-weight: 700; }
  .pick input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  .pick .st { margin-left: auto; }
  /* ---------- 📖 Retseptlar ---------- */
  .tabs2 { margin-top: 4px; }
  .recipes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 14px; }
  .recipe-card { display: flex; flex-direction: column; overflow: hidden; padding: 0; border: 2px solid var(--line); border-radius: 22px; background: var(--surface); text-align: left; color: var(--ink); box-shadow: var(--shadow); }
  .recipe-card .ph { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--accent-soft); font-size: 54px; }
  .recipe-card .ph img { width: 100%; height: 100%; object-fit: cover; }
  .recipe-card .tx { padding: 10px 12px 12px; }
  .recipe-card .tt { font-family: var(--display); font-weight: 600; font-size: 16px; line-height: 1.2; }
  .recipe-card .mt { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 2px; }
  .recipe-add { width: 100%; margin-top: 14px; min-height: 52px; }
  .recipe-detail .hero { margin: 0 -16px 12px; aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--accent-soft); font-size: 80px; }
  .recipe-detail .hero img { width: 100%; height: 100%; object-fit: cover; }
  .recipe-detail h2 { margin: 0 0 8px; font-family: var(--display); font-size: 24px; }
  .recipe-detail .steps { white-space: pre-wrap; line-height: 1.55; color: var(--ink-2); margin: 12px 0 0; }
  .slot-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .slot-pick button { min-height: 64px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--ink); }
  .slot-pick button .emo { font-size: 24px; }
  .recipe-empty { margin-top: 24px; }
  .drop { position: relative; display: grid; place-items: center; aspect-ratio: 16 / 10; border: 2px dashed var(--accent); border-radius: 22px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; overflow: hidden; text-align: center; font-size: 14px; }
  .drop img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop .change { position: absolute; right: 10px; bottom: 10px; background: rgba(47,42,37,.8); color: #fff; border-radius: 10px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; pointer-events: none; }
  /* Categories: a compact tab strip (emoji over a short label) on a tinted rail. */
  .r-cats { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 6px 16px; background: var(--accent-soft); border-radius: 0; }
  .r-cats::-webkit-scrollbar { display: none; }
  .r-cats button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 56px; padding: 6px 8px; border: 0; border-radius: 14px; background: transparent; color: var(--ink-2); font-size: 11.5px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .r-cats button .emo { font-size: 22px; }
  .r-cats button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 var(--accent-ink); }
  .step-label { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .step-label b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-fill); color: var(--on-accent); font-size: 11px; }
  /* Products: a grid of tiles, clearly different from the category strip. */
  .r-picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .r-picks button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 84px; padding: 8px 4px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 700; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
  .r-picks button .emo { font-size: 30px; }
  .r-picks button[aria-pressed="true"] { border-color: var(--accent-ink); background: var(--accent-soft); }
  .r-picks button[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 4px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-fill); color: var(--on-accent); font-size: 12px; line-height: 20px; }
  .r-picks button:disabled { opacity: .5; }

</style>
</head>
<body>
<div class="app" data-section="taomlar">
  <main class="main" id="main">
    <div class="segmented tabs2" role="tablist" aria-label="Taomlar">
      <button role="tab" data-tab="menu">📅 Menyu</button>
      <button role="tab" data-tab="recipes">📖 Retseptlar</button>
    </div>
    <div id="menu-pane">
    <div class="weeknav">
      <button class="icon-btn" id="prev" aria-label="Oldingi hafta"><i data-lucide="chevron-left"></i></button>
      <span class="label" id="wlabel"></span>
      <button class="icon-btn" id="next" aria-label="Keyingi hafta"><i data-lucide="chevron-right"></i></button>
    </div>
    <div class="days" id="days" role="tablist" aria-label="Hafta kunlari"></div>
    <div id="slots"></div>
    <div class="bar" style="display:flex;gap:8px;margin-top:16px">
      <button class="btn ghost" style="flex:1;font-size:14px" id="fav-btn"><i data-lucide="star"></i>Sevimlilar</button>
      <button class="btn ghost" style="flex:1;font-size:14px" id="past-btn"><i data-lucide="history"></i>Avvalgi taomlar</button>
    </div>
    </div>
    <div id="recipes-pane" hidden></div>
  </main>
</div>

<script>
const { $, $$, esc, icons } = App;
const SLOTS = [
  { id: "nonushta", name: "Nonushta", emoji: "🍳", bg: "#FFF1C4" },
  { id: "tushlik", name: "Tushlik", emoji: "🍲", bg: "#FFE4D9" },
  { id: "kechki", name: "Kechki ovqat", emoji: "🌙", bg: "#E8E6FF" },
];
const slotName = (id) => (SLOTS.find((s) => s.id === id) || {}).name;
const ingChip = (g, extra = "") => `<span class="chip ing"><span class="emo" aria-hidden="true">${Stickers.forName(g, "boshqa")}</span>${esc(g)}${extra}</span>`;

function weekStart(s) { const d = App.parseYmd(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return App.ymd(d); }
let selected = App.today();
let meals = [];
let groceries = [];
let recipes = [];
let recipesMissing = false; // the recipes table isn't set up on the server yet
let recipeUrls = {};
let tab = new URLSearchParams(location.search).get("tab") === "recipes" ? "recipes" : "menu";

async function render() {
  [meals, groceries] = await Promise.all([Store.list("meals", { order: "created_at", asc: true }), Store.list("grocery_items")]);
  try { recipes = await Store.list("recipes", { order: "created_at" }); recipesMissing = false; }
  catch (e) { console.warn("recipes", e); recipes = []; recipesMissing = true; }
  try { recipeUrls = await Store.photoUrls(recipes.map((r) => r.photo_path)); } catch (e) { recipeUrls = {}; }
  draw();
}

function setTab(t) {
  tab = t;
  $$('[data-tab]').forEach((b) => { const on = b.dataset.tab === t; b.classList.toggle("active", on); b.setAttribute("aria-selected", on); });
  $("#menu-pane").hidden = t !== "menu";
  $("#recipes-pane").hidden = t !== "recipes";
  if (t === "recipes") drawRecipes();
}
$$('[data-tab]').forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));

function draw() {
  if (tab === "recipes") drawRecipes();
  const start = weekStart(selected);
  const days = Array.from({ length: 7 }, (_, i) => App.addDays(start, i));
  const s = App.parseYmd(days[0]), e = App.parseYmd(days[6]);
  $("#wlabel").textContent = start === weekStart(App.today()) ? "Shu hafta" : `${s.getDate()}-${App.MONTHS[s.getMonth()]} – ${e.getDate()}-${App.MONTHS[e.getMonth()]}`;
  $("#days").innerHTML = days.map((d) => {
    const dt = App.parseYmd(d);
    const filled = SLOTS.map((sl) => meals.some((m) => m.day_date === d && m.slot === sl.id));
    return `<button class="day ${d === selected ? "active" : ""} ${d === App.today() ? "today" : ""}" data-d="${d}" role="tab" aria-selected="${d === selected}" aria-label="${App.WEEKDAYS[dt.getDay()]}, ${dt.getDate()}-${App.MONTHS[dt.getMonth()]}">
      <span class="wd">${App.WEEKDAYS_SHORT[dt.getDay()]}</span><span class="dn">${dt.getDate()}</span>
      <span class="dots">${filled.map((f) => `<i class="${f ? "f" : ""}"></i>`).join("")}</span></button>`;
  }).join("");

  const dt = App.parseYmd(selected);
  $("#slots").innerHTML = `<div class="section-head" style="margin-top:18px"><h2>${App.fmtShort(selected) === "Bugun" ? "Bugun · " : ""}${App.WEEKDAYS[dt.getDay()]}, ${dt.getDate()}-${App.MONTHS[dt.getMonth()]} <span class="emo" aria-hidden="true">🍽️</span></h2></div>` +
    SLOTS.map((sl) => {
      const list = meals.filter((m) => m.day_date === selected && m.slot === sl.id);
      return `<div class="card slot">
        <div class="slot-h"><span class="si emo" style="background:${sl.bg}" aria-hidden="true">${sl.emoji}</span><span class="sl">${sl.name}</span></div>
        ${list.map((m) => `<div class="meal" data-id="${m.id}" role="button" tabindex="0">
          <h4>${esc(m.title)}${m.favorite ? `<i data-lucide="star"></i>` : ""}</h4>
          ${m.description ? `<p>${esc(m.description)}</p>` : ""}
          ${m.ingredients && m.ingredients.length ? `<div class="ings">${m.ingredients.map((g) => ingChip(g)).join("")}</div>` : ""}
        </div>`).join("")}
        ${list.length ? "" : `<button class="add-slot" data-add="${sl.id}"><i data-lucide="plus"></i>${sl.name} qo'shish</button>`}
      </div>`;
    }).join("");
  icons();
}

$("#days").addEventListener("click", (e) => { const b = e.target.closest(".day"); if (b) { selected = b.dataset.d; draw(); } });
$("#prev").addEventListener("click", () => { selected = App.addDays(selected, -7); draw(); });
$("#next").addEventListener("click", () => { selected = App.addDays(selected, 7); draw(); });
$("#slots").addEventListener("click", (e) => {
  const a = e.target.closest("[data-add]"); if (a) return openEditor(null, { slot: a.dataset.add });
  const m = e.target.closest(".meal"); if (m) openEditor(meals.find((x) => x.id === m.dataset.id));
});
$("#slots").addEventListener("keydown", (e) => { if (e.key === "Enter" && e.target.classList.contains("meal")) e.target.click(); });

/* ---------- editor ---------- */
function openEditor(meal, preset = {}) {
  const isNew = !meal;
  const m = meal || { title: "", description: "", ingredients: [], notes: "", favorite: false, slot: preset.slot || "kechki", day_date: selected, ...preset };
  let ings = [...(m.ingredients || [])];
  App.sheet({
    title: isNew ? "Nima pishiramiz? 🍲" : "Taom 🍽️",
    body: `<form id="mform" novalidate>
      <div class="field"><label for="m-title">Taom nomi</label><input class="input" id="m-title" name="title" value="${esc(m.title)}" autocomplete="off" ${isNew ? "autofocus" : ""} maxlength="60" list="known"><span class="error-text" hidden id="m-err">Taom nomini yozing</span>
        <datalist id="known">${[...new Set(meals.map((x) => x.title))].map((t) => `<option value="${esc(t)}">`).join("")}</datalist></div>
      <div class="field-row">
        <div class="field"><label for="m-day">Kun</label><input class="input" type="date" id="m-day" name="day_date" value="${m.day_date}"></div>
        <div class="field"><label for="m-slot">Vaqti</label><select class="select" id="m-slot" name="slot">${SLOTS.map((s) => `<option value="${s.id}" ${s.id === m.slot ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>
      </div>
      <div class="field"><label for="m-desc">Tavsif</label><input class="input" id="m-desc" name="description" value="${esc(m.description)}" maxlength="120"></div>
      <div class="field"><span class="label">Masalliqlar</span>
        <div class="ing-edit" id="ing-list"></div>
        <div class="ing-add"><input class="input" id="ing-in" placeholder="masalan, Kartoshka" aria-label="Masalliq nomi" maxlength="40"><button type="button" class="btn ghost" id="ing-add" aria-label="Masalliq qo'shish"><i data-lucide="plus"></i></button></div>
      </div>
      <div class="field"><label for="m-notes">Tayyorlash bo'yicha izoh</label><textarea class="textarea" id="m-notes" name="notes" maxlength="500">${esc(m.notes)}</textarea></div>
      <label class="switch"><span><b style="font-weight:600">Sevimli taom</b><br><span class="hint">Keyin bir bosishda qayta rejalashtirish uchun</span></span><input type="checkbox" name="favorite" ${m.favorite ? "checked" : ""}></label>
      <button type="button" class="btn ghost block" id="to-grocery" style="margin-top:12px"><i data-lucide="shopping-basket"></i>Masalliqlarni Ro'zg'orga yuborish</button>
    </form>`,
    foot: `${isNew ? `<button class="btn ghost" data-close>Bekor qilish</button>` : `<button class="btn danger" data-del aria-label="Taomni o'chirish"><i data-lucide="trash-2"></i></button>`}<button class="btn primary" data-save>${isNew ? `Qo'shish <span class="emo" aria-hidden="true">😋</span>` : "Saqlash"}</button>`,
    onMount(el, api) {
      const f = $("#mform", el);
      const drawIngs = () => {
        $("#ing-list", el).innerHTML = ings.map((g, i) => ingChip(g, `<button type="button" data-rm="${i}" aria-label="${esc(g)} ni olib tashlash"><i data-lucide="x" style="width:14px;height:14px"></i></button>`)).join("");
        $("#to-grocery", el).hidden = !ings.length;
        icons();
      };
      const addIng = () => {
        const inp = $("#ing-in", el);
        inp.value.split(",").map((x) => x.trim()).filter(Boolean).forEach((x) => { if (!ings.some((g) => g.toLowerCase() === x.toLowerCase())) ings.push(x); });
        inp.value = ""; drawIngs(); inp.focus();
      };
      drawIngs();
      $("#ing-add", el).addEventListener("click", addIng);
      $("#ing-in", el).addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); addIng(); } });
      $("#ing-list", el).addEventListener("click", (e) => { const b = e.target.closest("[data-rm]"); if (b) { ings.splice(+b.dataset.rm, 1); drawIngs(); } });
      // Reusing a known meal fills its ingredients
      f.elements.title.addEventListener("change", () => {
        const known = [...meals].reverse().find((x) => x.title.toLowerCase() === f.elements.title.value.trim().toLowerCase());
        if (known && !ings.length) { ings = [...(known.ingredients || [])]; if (!f.elements.description.value) f.elements.description.value = known.description || ""; if (!f.elements.notes.value) f.elements.notes.value = known.notes || ""; drawIngs(); }
      });
      f.elements.title.addEventListener("input", () => ($("#m-err", el).hidden = true));
      $("#to-grocery", el).addEventListener("click", () => sendToGrocery(ings, f.elements.title.value.trim() || "taom"));

      const save = async () => {
        if ($("#ing-in", el).value.trim()) addIng();
        const v = { title: f.elements.title.value.trim(), day_date: f.elements.day_date.value || selected, slot: f.elements.slot.value, description: f.elements.description.value.trim(), notes: f.elements.notes.value.trim(), favorite: f.elements.favorite.checked, ingredients: ings };
        if (!v.title) { $("#m-err", el).hidden = false; f.elements.title.focus(); return; }
        $("[data-save]", el).disabled = true;
        try {
          if (isNew) {
            await Store.insert("meals", { ...v, created_by: Store.ctx.profile.id });
            Store.notify("meal_added", { meal: v.title, slot: v.slot, day: App.WEEKDAYS[App.parseYmd(v.day_date).getDay()], slotName: slotName(v.slot) }, "taomlar.html");
            App.toast(`«${v.title}» rejaga qo'shildi`);
          } else {
            await Store.update("meals", m.id, v);
            App.toast("Saqlandi");
          }
          selected = v.day_date; api.close(); render();
        } catch (e) { App.fail(e); $("[data-save]", el).disabled = false; }
      };
      $("[data-save]", el).addEventListener("click", save);
      f.addEventListener("submit", (e) => { e.preventDefault(); save(); });
      const del = $("[data-del]", el);
      if (del) del.addEventListener("click", async () => {
        api.close();
        if (!(await App.confirm(`«${m.title}» menyudan olib tashlanadi.`, "Taomni o'chirish"))) return;
        try { await Store.remove("meals", m.id); App.toast("O'chirildi", "trash-2"); render(); } catch (e) { App.fail(e); }
      });
    },
  });
}

/* ---------- send ingredients to Ro'zg'or ---------- */
function sendToGrocery(ings, mealTitle) {
  const find = (n) => groceries.find((g) => g.name.trim().toLowerCase() === n.trim().toLowerCase());
  App.sheet({
    title: "Ro'zg'orga yuborish",
    body: `<p class="hint" style="margin:0 0 6px">Uyda yo'q masalliqlarni belgilang — ular «Kerak» ro'yxatiga tushadi.</p>
      ${ings.map((n, i) => { const g = find(n); const st = g ? g.status : null;
        return `<label class="pick"><input type="checkbox" value="${i}" ${st === "kerak" ? "disabled" : st === "bor" ? "" : "checked"}><span class="sticker sm" data-section="rozgor" aria-hidden="true">${Stickers.forName(n, "boshqa")}</span><span>${esc(n)}</span>
          <span class="st">${st === "kerak" ? `<span class="chip urgent">Ro'yxatda bor</span>` : st === "bor" ? `<span class="chip sage">Uyda bor</span>` : `<span class="chip">Yangi</span>`}</span></label>`; }).join("")}`,
    foot: `<button class="btn ghost" data-close>Bekor qilish</button><button class="btn accent" data-send><i data-lucide="send"></i>Yuborish</button>`,
    onMount(el, api) {
      $("[data-send]", el).addEventListener("click", async () => {
        const chosen = $$("input:checked:not(:disabled)", el).map((c) => ings[+c.value]);
        if (!chosen.length) return api.close();
        const me = Store.ctx.profile.id, now = new Date().toISOString();
        $("[data-send]", el).disabled = true;
        try {
          for (const n of chosen) {
            const g = find(n);
            if (g) await Store.update("grocery_items", g.id, { status: "kerak", marked_by: me, marked_at: now, purchased_by: null, purchased_at: null });
            else await Store.insert("grocery_items", { name: n, category: "boshqa", quantity: "", note: `«${mealTitle}» uchun`, urgent: false, status: "kerak", added_by: me, marked_by: me, marked_at: now });
          }
          Store.notify("grocery_need", { items: chosen }, "rozgor.html?view=need");
          App.toast(`${chosen.length} ta masalliq Ro'zg'orga yuborildi`, "shopping-basket");
          api.close(); groceries = await Store.list("grocery_items");
        } catch (e) { App.fail(e); $("[data-send]", el).disabled = false; }
      });
    },
  });
}

/* ---------- 📖 Retseptlar ---------- */
// A dish emoji from its name; a generic fallback becomes 🍲.
const dishEmoji = (title) => { const e = Stickers.forName(title || "", "boshqa"); return !title || e === Stickers.forName("", "boshqa") ? "🍲" : e; };
const RECIPE_CATS = Catalog.CATEGORIES.filter((c) => !["uy", "gigiyena", "dori"].includes(c.id));
const ingEmoji = (n) => (Catalog.find(n) || {}).emoji || Stickers.forName(n, "boshqa");
const recipeChip = (g) => `<span class="chip ing"><span class="emo" aria-hidden="true">${ingEmoji(g)}</span>${esc(g)}</span>`;

function drawRecipes() {
  const pane = $("#recipes-pane");
  if (recipesMissing) {
    pane.innerHTML = `<div class="empty recipe-empty"><div class="ico emo" aria-hidden="true">🛠️</div><strong>Retseptlar uchun serverni sozlang</strong><p>Supabase → SQL Editor'da <b>supabase/recipes.sql</b> faylini bir marta ishga tushiring.</p></div>`;
    return;
  }
  pane.innerHTML = `<button class="btn primary recipe-add" id="recipe-add"><i data-lucide="plus"></i>Retsept qo'shish</button>` +
    (recipes.length ? `<div class="recipes">${recipes.map((r) => `<button class="recipe-card" data-rid="${r.id}">
        <span class="ph">${recipeUrls[r.photo_path] ? `<img src="${esc(recipeUrls[r.photo_path])}" alt="">` : `<span class="emo" aria-hidden="true">${r.emoji || dishEmoji(r.title)}</span>`}</span>
        <span class="tx"><span class="tt">${esc(r.title)}</span><span class="mt">${(r.ingredients || []).length} masalliq</span></span></button>`).join("")}</div>`
      : `<div class="empty recipe-empty"><div class="ico emo" aria-hidden="true">📖</div><strong>Hali retsept yo'q</strong><p>Sevimli taomlaringizni rasm va tayyorlash usuli bilan saqlang.</p></div>`);
  icons();
}
$("#recipes-pane").addEventListener("click", (e) => {
  if (e.target.closest("#recipe-add")) return openRecipeEditor();
  const c = e.target.closest("[data-rid]"); if (c) openRecipe(recipes.find((r) => r.id === c.dataset.rid));
});

/** Put a recipe (or any named dish) on today's menu in the chosen slot. */
async function addMealToday(src, slot) {
  const steps = src.steps || "";
  const row = { title: src.title, day_date: App.today(), slot, description: steps.split("\n")[0].slice(0, 120), ingredients: [...(src.ingredients || [])], notes: steps, favorite: false, created_by: Store.ctx.profile.id };
  await Store.insert("meals", row);
  Store.notify("meal_added", { meal: row.title, slot, day: App.WEEKDAYS[App.parseYmd(row.day_date).getDay()], slotName: slotName(slot) }, "taomlar.html");
  App.toast(`«${row.title}» bugungi ${slotName(slot).toLowerCase()}ga qo'shildi 🍽️`);
  selected = row.day_date;
  await render();
}

/** Choose breakfast / lunch / dinner, then call onPick(slot). */
function pickSlot(title, onPick) {
  App.sheet({
    title: `«${title}» — qachon?`,
    body: `<div class="slot-pick">${SLOTS.map((sl) => `<button type="button" data-slot="${sl.id}"><span class="emo" aria-hidden="true">${sl.emoji}</span>${sl.name}</button>`).join("")}</div>`,
    onMount(el, api) {
      el.addEventListener("click", async (e) => {
        const b = e.target.closest("[data-slot]"); if (!b) return;
        api.close();
        try { await onPick(b.dataset.slot); } catch (err) { App.fail(err); }
      });
    },
  });
}

function openRecipe(r) {
  if (!r) return;
  App.sheet({
    title: "Retsept 📖",
    body: `<div class="recipe-detail">
        <div class="hero">${recipeUrls[r.photo_path] ? `<img src="${esc(recipeUrls[r.photo_path])}" alt="${esc(r.title)}">` : `<span class="emo" aria-hidden="true">${r.emoji || dishEmoji(r.title)}</span>`}</div>
        <h2>${esc(r.title)}</h2>
        ${(r.ingredients || []).length ? `<div class="ings">${r.ingredients.map(recipeChip).join("")}</div>` : ""}
        ${r.steps ? `<p class="steps">${esc(r.steps)}</p>` : ""}
        <button class="btn primary block" data-today style="margin-top:16px"><i data-lucide="calendar-plus"></i>Bugungi menyuga qo'shish</button>
        ${(r.ingredients || []).length ? `<button class="btn ghost block" data-to-grocery style="margin-top:10px"><i data-lucide="shopping-basket"></i>Masalliqlarni Ro'zg'orga</button>` : ""}
      </div>`,
    foot: `<button class="btn danger" data-del-recipe aria-label="Retseptni o'chirish"><i data-lucide="trash-2"></i></button><button class="btn ghost" data-edit-recipe><i data-lucide="pencil"></i>Tahrirlash</button>`,
    onMount(el, api) {
      $("[data-today]", el).addEventListener("click", () => { api.close(); setTimeout(() => pickSlot(r.title, (slot) => addMealToday(r, slot)), 300); });
      const g = $("[data-to-grocery]", el);
      if (g) g.addEventListener("click", () => { api.close(); setTimeout(() => sendToGrocery(r.ingredients, r.title), 300); });
      $("[data-edit-recipe]", el).addEventListener("click", () => { api.close(); setTimeout(() => openRecipeEditor(r), 300); });
      $("[data-del-recipe]", el).addEventListener("click", async () => {
        api.close();
        if (!(await App.confirm(`«${r.title}» retsepti o'chiriladi.`, "Retseptni o'chirish"))) return;
        try {
          await Store.remove("recipes", r.id);
          await render();
          App.undoToast(`«${r.title}» o'chirildi`, async () => {
            const { id, household_id, ...row } = r;
            try { await Store.insert("recipes", row); await render(); } catch (e2) { App.fail(e2); }
          }, "trash-2");
        } catch (e) { App.fail(e); }
      });
    },
  });
}

function openRecipeEditor(r) {
  const isNew = !r;
  const it = r || { title: "", ingredients: [], steps: "", photo_path: null };
  let cat = RECIPE_CATS[0].id, blob = null;
  const norm = (n) => Stickers.normalize(n);
  App.sheet({
    title: isNew ? "Yangi retsept 📖" : "Retseptni tahrirlash ✏️",
    body: `<form id="rform" novalidate>
      <div class="field"><span class="label">Rasm</span>
        <label class="drop" id="r-drop">${recipeUrls[it.photo_path] ? `<img src="${esc(recipeUrls[it.photo_path])}" alt=""><span class="change">Almashtirish</span>` : `<span><span class="emo" style="font-size:30px" aria-hidden="true">📷</span><br>Rasm tanlash</span>`}
          <input type="file" accept="image/*" id="r-file" aria-label="Rasm tanlash"></label></div>
      <div class="field"><label for="r-title">Taom nomi</label><input class="input" id="r-title" value="${esc(it.title)}" maxlength="60" autocomplete="off" placeholder="masalan, Osh"><span class="error-text" hidden id="r-err">Taom nomini yozing</span></div>
      <div class="field"><label for="r-ings">Masalliqlar</label><input class="input" id="r-ings" value="${esc((it.ingredients || []).join(", "))}" autocomplete="off" placeholder="pastdan tanlang yoki yozing, vergul bilan">
        <div class="r-cats" id="r-cats" role="group" aria-label="Turkum" style="margin-top:10px"></div>
        <div class="r-picks" id="r-picks" role="group" aria-label="Masalliqlar" style="margin-top:10px"></div></div>
      <div class="field"><label for="r-steps">Tayyorlash</label><textarea class="textarea" id="r-steps" rows="6" maxlength="4000" placeholder="1. ...">${esc(it.steps || "")}</textarea></div>
    </form>`,
    foot: `<button class="btn ghost" data-close>Bekor qilish</button><button class="btn primary" data-save>${isNew ? "Saqlash" : "O'zgarishlarni saqlash"}</button>`,
    onMount(el, api) {
      const ingIn = $("#r-ings", el);
      const names = () => ingIn.value.split(",").map((x) => x.trim()).filter(Boolean);
      const has = (n) => names().some((x) => norm(x) === norm(n));
      const drawCats = () => { $("#r-cats", el).innerHTML = RECIPE_CATS.map((c) => `<button type="button" data-rcat="${c.id}" aria-pressed="${c.id === cat}"><span class="emo" aria-hidden="true">${c.emoji}</span>${esc(c.name)}</button>`).join(""); };
      const drawPicks = () => { $("#r-picks", el).innerHTML = Catalog.category(cat).products.map((x) => `<button type="button" data-rpick="${esc(x.name)}" aria-pressed="${has(x.name)}"><span class="emo" aria-hidden="true">${x.emoji}</span>${esc(x.name)}</button>`).join(""); };
      drawCats(); drawPicks();
      $("#r-cats", el).addEventListener("click", (e) => { const b = e.target.closest("[data-rcat]"); if (!b) return; cat = b.dataset.rcat; drawCats(); drawPicks(); });
      $("#r-picks", el).addEventListener("click", (e) => {
        const b = e.target.closest("[data-rpick]"); if (!b) return;
        const n = b.dataset.rpick, list = names();
        ingIn.value = (has(n) ? list.filter((x) => norm(x) !== norm(n)) : list.concat(n)).join(", ");
        drawPicks();
      });
      ingIn.addEventListener("input", drawPicks);
      $("#r-title", el).addEventListener("input", () => ($("#r-err", el).hidden = true));
      $("#r-file", el).addEventListener("change", async (e) => {
        const file = e.target.files[0]; if (!file) return;
        try { blob = await Store.compressImage(file, Store.mode === "demo" ? 900 : 1600, Store.mode === "demo" ? 0.72 : 0.85); }
        catch (err) { blob = null; return App.toast("Bu rasmni ochib bo'lmadi. Boshqa rasm tanlang.", "image-off"); }
        const drop = $("#r-drop", el);
        drop.querySelectorAll("img, span").forEach((n) => n.remove());
        drop.insertAdjacentHTML("afterbegin", `<img src="${URL.createObjectURL(blob)}" alt=""><span class="change">Almashtirish</span>`);
      });
      $("[data-save]", el).addEventListener("click", async () => {
        const title = $("#r-title", el).value.trim();
        if (!title) { $("#r-err", el).hidden = false; $("#r-title", el).focus(); return; }
        const btn = $("[data-save]", el); btn.disabled = true; btn.textContent = blob ? "Rasm yuklanmoqda…" : "Saqlanmoqda…";
        const v = { title, ingredients: names(), steps: $("#r-steps", el).value.trim(), emoji: dishEmoji(title), updated_at: new Date().toISOString() };
        let photoLost = false;
        if (blob) {
          try { v.photo_path = await Store.uploadPhoto(blob); if (!isNew && it.photo_path) Store.removePhoto(it.photo_path); }
          catch (err) { console.warn("photo", err); photoLost = true; }
        }
        try {
          if (isNew) await Store.insert("recipes", { ...v, photo_path: v.photo_path || null, created_by: Store.ctx.profile.id });
          else await Store.update("recipes", it.id, v);
          api.close(); await render();
          App.toast(photoLost ? "Rasm yuklanmadi — retsept rasmsiz saqlandi" : isNew ? `«${title}» retsepti saqlandi 📖` : "Saqlandi", photoLost ? "image-off" : "check");
        } catch (err) { App.fail(err); btn.disabled = false; btn.textContent = "Saqlash"; }
      });
    },
  });
}

/* ---------- favorites & past meals ---------- */
function uniqueMeals(list) {
  const seen = new Map();
  [...list].sort((a, b) => (a.day_date < b.day_date ? 1 : -1)).forEach((m) => { const k = m.title.toLowerCase(); if (!seen.has(k)) seen.set(k, m); });
  return [...seen.values()];
}
function openLibrary(kind) {
  const list = kind === "fav" ? uniqueMeals(meals.filter((m) => m.favorite)) : uniqueMeals(meals.filter((m) => m.day_date < App.today()));
  App.sheet({
    title: kind === "fav" ? "Sevimli taomlar" : "Avvalgi taomlar",
    body: list.length ? `<p class="hint" style="margin:0 0 6px">Taomni tanlang — u ${App.fmtShort(selected).toLowerCase()} uchun rejaga qo'shiladi.</p><div class="list">${list.map((m) => `
        <button class="row" data-id="${m.id}" style="width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 2px">
          <div class="grow"><div class="title">${esc(m.title)}</div><div class="meta">${slotName(m.slot)} · ${App.fmtDate(m.day_date)}${m.ingredients && m.ingredients.length ? ` · ${m.ingredients.length} masalliq` : ""}</div></div>
          <i data-lucide="calendar-plus" style="color:var(--accent)"></i></button>`).join("")}</div>`
      : `<div class="empty"><div class="ico emo" aria-hidden="true">${kind === "fav" ? "⭐" : "📖"}</div><strong>${kind === "fav" ? "Sevimlilar yo'q" : "Hali tarix yo'q"}</strong><p>${kind === "fav" ? "Taomni ochib, «Sevimli taom»ni yoqing." : "O'tgan kunlar uchun rejalashtirilgan taomlar shu yerda ko'rinadi."}</p></div>`,
    onMount(el, api) {
      el.addEventListener("click", (e) => {
        const b = e.target.closest("[data-id]"); if (!b) return;
        const src = meals.find((x) => x.id === b.dataset.id);
        api.close();
        setTimeout(() => openEditor(null, { title: src.title, description: src.description, ingredients: [...(src.ingredients || [])], notes: src.notes, favorite: src.favorite, slot: src.slot, day_date: selected }), 300);
      });
    },
  });
}
$("#fav-btn").addEventListener("click", () => openLibrary("fav"));
$("#past-btn").addEventListener("click", () => openLibrary("past"));

draw();
setTab(tab);
App.boot({ page: "taomlar", title: "Taomlar", emoji: "🍲", sub: "Haftalik oilaviy reja", tables: ["meals", "grocery_items", "recipes"], render }).then(() => {
  if (new URLSearchParams(location.search).get("new")) openEditor();
});
</script>
</body>
