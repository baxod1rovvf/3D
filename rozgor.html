<!doctype html>
<html lang="uz">
<head>
<title>Ro'zg'or — Oila Uchun</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="js/config.js"></script>
<script src="js/stickers.js"></script>
<script src="js/catalog.js"></script>
<script src="js/messages.js"></script>
<script src="js/reminders.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<style>
  .cat-h { display: flex; align-items: center; gap: 8px; margin: 20px 2px 8px; font-family: var(--display); font-size: 17px; font-weight: 600; color: var(--ink); }
  .cat-h .emo { font-size: 20px; }
  .cat-h .n { margin-left: auto; min-width: 26px; padding: 1px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-ink); font-family: var(--font); font-weight: 800; font-size: 12.5px; text-align: center; }

  .g-row { cursor: default; gap: 10px; transition: background var(--t) var(--ease), opacity var(--t); }
  .g-row .grow { cursor: pointer; }
  .g-row.need { background: #FFF1F2; }
  .g-row.need .title { color: var(--danger-ink); }
  .g-row.need .sticker { background: #FFE1E4; box-shadow: 0 0 0 2px #FFC9CF, 0 3px 6px rgba(43, 36, 64, .12); }
  .g-row.bought .sticker { filter: grayscale(.5); opacity: .75; }
  .g-row.bought .title { text-decoration: line-through; color: var(--muted); }

  /* The X toggle — big, one-thumb target */
  .xbox { width: 48px; height: 48px; margin: -6px -4px -6px -8px; border: 0; background: none; display: grid; place-items: center; flex: none; }
  .xbox .b {
    width: 32px; height: 32px; border-radius: 11px;
    border: 2.5px solid var(--line-2); background: #fff;
    display: grid; place-items: center; color: transparent;
    transition: background var(--t) var(--ease), border-color var(--t), color var(--t), transform var(--t-fast);
  }
  .xbox .b svg { width: 18px; height: 18px; stroke-width: 3; }
  .xbox:active .b { transform: scale(.88); }
  .xbox.on .b { background: var(--danger); border-color: var(--danger); color: #fff; animation: pop 360ms var(--bounce); }
  .xbox.done .b { background: var(--sage-soft); border-color: transparent; color: #13774A; }

  .buy { width: 52px; height: 52px; margin: -8px -10px -8px 0; border: 0; background: none; display: grid; place-items: center; flex: none; }
  .buy .c { width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--accent-deep); display: grid; place-items: center; color: transparent; transition: all var(--t) var(--ease); }
  .buy .c svg { width: 18px; height: 18px; stroke-width: 3; }
  .buy:active .c { transform: scale(.88); }
  .buy.on .c { background: var(--accent-fill); color: var(--on-accent); animation: pop 360ms var(--bounce); }

  .leaving { animation: leave 420ms 260ms var(--ease) forwards; }
  @keyframes leave { to { opacity: 0; transform: translateX(30px); } }

  .qty { font-size: 13px; font-weight: 800; color: var(--ink-2); background: var(--surface-2); border: 1.5px solid var(--line-2); padding: 2px 9px; border-radius: 10px; white-space: nowrap; flex: none; }
  .legend { display: flex; gap: 6px 14px; font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 10px 2px 0; align-items: center; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }
  .bar { display: flex; gap: 8px; margin-top: 14px; }
  .bar .btn { flex: 1; min-height: 46px; font-size: 14.5px; padding: 0 12px; }
  .restock { min-height: 48px; padding: 0 12px; font-size: 13.5px; box-shadow: 0 2px 0 var(--line-2); }

  /* Live sticker preview in the editor */
  .name-row { display: flex; align-items: center; gap: 12px; }
  .name-row .input { flex: 1; min-width: 0; }
  @media (prefers-reduced-motion: no-preference) {
    .sticker-preview.pop { animation: wiggle-pop 420ms var(--bounce); }
  }
  @keyframes wiggle-pop { 0% { transform: scale(.6) rotate(-12deg); } 60% { transform: scale(1.15) rotate(6deg); } 100% { transform: none; } }
  /* ---------- 🎁 Xohishlar: candy-shop look ---------- */
  .gift-hero { position: relative; overflow: hidden; margin-top: 14px; padding: 18px 16px 16px; border-radius: 24px; color: #3B1530;
    background: linear-gradient(135deg, #FFD6E8 0%, #FFE7C2 55%, #E4DCFF 100%); box-shadow: 0 4px 0 #F2B6CF; }
  .gift-hero h3 { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.2; }
  .gift-hero p { margin: 6px 0 0; font-size: 14px; font-weight: 600; max-width: 80%; }
  .gift-hero .floaty { position: absolute; font-size: 26px; opacity: .9; pointer-events: none; }
  .gift-hero .f1 { right: 14px; top: 10px; } .gift-hero .f2 { right: 54px; bottom: 8px; font-size: 22px; } .gift-hero .f3 { right: 10px; bottom: 12px; font-size: 30px; }
  .gift-sent { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.7); font-size: 12.5px; font-weight: 800; }
  .gifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .gift { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 6px 8px; border-radius: 22px; text-align: center;
    background: var(--g-bg); border: 2px solid var(--g-line); box-shadow: 0 3px 0 var(--g-line); transition: transform .15s; }
  .gift:nth-child(6n+1) { --g-bg: #FFE3EE; --g-line: #F7BCD2; } .gift:nth-child(6n+2) { --g-bg: #FFF1CC; --g-line: #F4D98B; }
  .gift:nth-child(6n+3) { --g-bg: #E0F5E9; --g-line: #A9DFC0; } .gift:nth-child(6n+4) { --g-bg: #E6E3FF; --g-line: #C3BCFA; }
  .gift:nth-child(6n+5) { --g-bg: #FFE6D8; --g-line: #F8C2A3; } .gift:nth-child(6n+6) { --g-bg: #DFF1FF; --g-line: #A9D4F5; }
  .gift .ge { font-size: 42px; line-height: 1.1; display: inline-block; }
  .gift .gn { font-weight: 800; font-size: 14px; color: #2B2440; }
  .gift button { width: 100%; min-height: 44px; margin-top: 4px; border: 0; border-radius: 16px; background: #FF5C8A; color: #fff; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 #D93A6A; }
  .gift button:active { transform: translateY(2px); box-shadow: 0 1px 0 #D93A6A; }
  .gift button:disabled { background: #fff; color: #C2185B; box-shadow: none; font-size: 13px; white-space: nowrap; }
  .gift.sent { transform: scale(1.04) rotate(-2deg); }
  .heart-fly { position: absolute; left: 50%; top: 30%; font-size: 20px; pointer-events: none; z-index: 2; }
  @media (prefers-reduced-motion: no-preference) {
    .gift .ge { animation: bob 2.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
    .gift-hero .floaty { animation: bob 3s ease-in-out infinite; } .gift-hero .f2 { animation-delay: -1s; } .gift-hero .f3 { animation-delay: -2s; }
    .gift.sent .ge { animation: wish-jump .6s cubic-bezier(.3,1.6,.5,1); }
    .heart-fly { animation: heart-up 1s ease-out forwards; }
  }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-5px) rotate(3deg); } }
  @keyframes wish-jump { 0% { transform: scale(1); } 40% { transform: scale(1.45) translateY(-10px) rotate(-10deg); } 100% { transform: scale(1); } }
  @keyframes heart-up { from { opacity: 1; transform: translate(-50%, 0) scale(.6); } to { opacity: 0; transform: translate(calc(-50% + var(--x)), -90px) scale(1.2) rotate(var(--r)); } }
  /* Categories: a compact tab strip (emoji over a short label) on a tinted rail. */
  .cat-strip { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 6px 16px; background: var(--accent-soft); border-radius: 0; }
  .cat-strip::-webkit-scrollbar { display: none; }
  .cat-strip button { flex: none; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; min-height: 56px; padding: 6px 8px; border: 0; border-radius: 14px; background: transparent; color: var(--ink-2); font-size: 11.5px; font-weight: 700; line-height: 1.15; white-space: nowrap; }
  .cat-strip button .emo { font-size: 22px; }
  .cat-strip button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 2px 0 var(--accent-ink); }
  .step-label { display: flex; align-items: center; gap: 8px; margin: 14px 0 8px; font-size: 13px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .step-label b { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-fill); color: var(--on-accent); font-size: 11px; }
  /* Products: a grid of tiles, clearly different from the category strip. */
  .pick-chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pick-chips button { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 84px; padding: 8px 4px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--ink); font-size: 12.5px; font-weight: 700; line-height: 1.15; text-align: center; overflow-wrap: anywhere; }
  .pick-chips button .emo { font-size: 30px; }
  .pick-chips button[aria-pressed="true"] { border-color: var(--accent-ink); background: var(--accent-soft); }
  .pick-chips button[aria-pressed="true"]::after { content: "✓"; position: absolute; top: 4px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-fill); color: var(--on-accent); font-size: 12px; line-height: 20px; }
  .pick-chips button:disabled { opacity: .5; }
  .search { position: relative; margin-top: 12px; }
  .search > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
  .search .input { padding-left: 42px; padding-right: 48px; }
  .search .input::-webkit-search-cancel-button { display: none; }
  .search-clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
  .search-clear svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="app" data-section="rozgor">
  <main class="main" id="main">
    <div class="segmented" role="tablist" aria-label="Ro'yxat ko'rinishi">
      <button role="tab" data-view="all">Hammasi</button>
      <button role="tab" data-view="need">Kerak <span class="count" id="c-need">0</span></button>
      <button role="tab" data-view="bought">Olindi <span class="count" id="c-bought">0</span></button>
      <button role="tab" data-view="gift" aria-label="Xohishlar">🎁</button>
    </div>
    <div class="search" role="search">
      <i data-lucide="search" aria-hidden="true"></i>
      <input class="input" id="q" type="search" placeholder="Mahsulot qidirish… 🔍" aria-label="Mahsulot qidirish" autocomplete="off" enterkeyhint="search">
      <button class="search-clear" id="q-clear" aria-label="Qidiruvni tozalash" hidden><i data-lucide="x"></i></button>
    </div>
    <div id="list"></div>
  </main>
  <button class="fab" id="add" aria-label="Mahsulot qo'shish"><i data-lucide="plus"></i></button>
</div>

<script>
const { $, $$, esc, icons } = App;
const CATS = Catalog.CATEGORIES;
const catOf = (id) => CATS.find((c) => c.id === id) || CATS[CATS.length - 1];
const emojiFor = (name, cat) => (Catalog.find(name) || {}).emoji || Stickers.forName(name, cat);
const stickerOf = (i) => emojiFor(i.name, catOf(i.category).id);
const sticker = (i) => `<span class="sticker" aria-hidden="true">${stickerOf(i)}</span>`;
// The row just added wobbles in once. Realtime re-renders replace #list within the animation's
// 620ms, so keep the start time and resume each redraw where it left off (negative delay).
const WOBBLE_MS = 620;
let fresh = null; // { id, t0 }

let view = new URLSearchParams(location.search).get("view") || "all";
let items = [];
let loaded = false;

function setView(v) {
  view = v;
  $(".search").hidden = v === "gift";
  $("#add").hidden = v === "gift"; // the ➕ isn't for wishes, and it would cover a «Хочу»
  $$(".segmented button").forEach((b) => { const on = b.dataset.view === v; b.classList.toggle("active", on); b.setAttribute("aria-selected", on); });
  draw();
}

async function render() {
  items = await Store.list("grocery_items", { order: "created_at", asc: true });
  loaded = true;
  draw();
}

function metaFor(i) {
  const bits = [];
  if (i.urgent && i.status === "kerak") bits.push(`<span class="chip urgent"><i data-lucide="flame"></i>Shoshilinch</span>`);
  if (i.status === "kerak" && i.marked_by) bits.push(`${esc(App.nameOf(i.marked_by))} belgiladi · ${App.timeAgo(i.marked_at)}`);
  if (i.status === "olindi" && i.purchased_by) bits.push(`${esc(App.nameOf(i.purchased_by))} oldi · ${App.timeAgo(i.purchased_at)}`);
  if (i.note) bits.push(`<span>${esc(i.note)}</span>`);
  return bits.length ? `<div class="meta">${bits.join("")}</div>` : "";
}

function rowAll(i) {
  const st = i.status;
  const label = st === "kerak" ? `${i.name}: kerak deb belgilangan. Bekor qilish` : `${i.name}: uyda yo'q deb belgilash`;
  return `<div class="row g-row ${st === "kerak" ? "need" : st === "olindi" ? "bought" : ""}" data-id="${i.id}">
    <button class="xbox ${st === "kerak" ? "on" : st === "olindi" ? "done" : ""}" data-x aria-pressed="${st === "kerak"}" aria-label="${esc(label)}">
      <span class="b"><i data-lucide="${st === "olindi" ? "check" : "x"}"></i></span></button>
    ${sticker(i)}
    <div class="grow" data-edit><div class="title">${esc(i.name)}</div>${metaFor(i)}</div>
    ${i.quantity ? `<span class="qty">${esc(i.quantity)}</span>` : ""}
  </div>`;
}
function rowNeed(i) {
  return `<div class="row g-row" data-id="${i.id}">
    ${sticker(i)}
    <div class="grow" data-edit><div class="title">${esc(i.name)}</div>${metaFor(i)}</div>
    ${i.quantity ? `<span class="qty">${esc(i.quantity)}</span>` : ""}
    <button class="buy" data-buy aria-label="${esc(i.name)}: xarid qilindi"><span class="c"><i data-lucide="check"></i></span></button>
  </div>`;
}
function rowBought(i) {
  return `<div class="row g-row bought" data-id="${i.id}">
    ${sticker(i)}
    <div class="grow" data-edit><div class="title">${esc(i.name)}</div>${metaFor(i)}</div>
    <button class="btn ghost restock" data-restock aria-label="${esc(i.name)}: uyga joylandi">Joylandi</button>
  </div>`;
}

function grouped(list, rowFn) {
  return CATS.map((c) => {
    const rows = list.filter((i) => catOf(i.category).id === c.id);
    if (!rows.length) return "";
    return `<div class="cat-h"><span class="emo" aria-hidden="true">${c.emoji}</span>${c.name}<span class="n">${rows.length}</span></div>
      <div class="card list">${rows.map(rowFn).join("")}</div>`;
  }).join("");
}

let query = "";
// Search matches the product name or note, ignoring case and apostrophe variants (o' / o‘ / oʻ).
const matches = (i) => !query || Stickers.normalize(`${i.name} ${i.note || ""}`).includes(query);

function draw() {
  if (!loaded) { $("#list").innerHTML = `<div class="skeleton" style="height:220px;margin-top:18px"></div>`; return; }
  const need = items.filter((i) => i.status === "kerak").sort((a, b) => (b.urgent - a.urgent) || ((a.marked_at || "") > (b.marked_at || "") ? -1 : 1));
  const bought = items.filter((i) => i.status === "olindi").sort((a, b) => (a.purchased_at > b.purchased_at ? -1 : 1));
  $("#c-need").textContent = need.length;
  $("#c-bought").textContent = bought.length;
  let html = "";
  if (view === "gift") { drawGifts(); return; }
  if (query) {
    const hits = (view === "need" ? need : view === "bought" ? bought : items).filter(matches);
    const rowFn = view === "need" ? rowNeed : view === "bought" ? rowBought : rowAll;
    const raw = $("#q").value.trim();
    $("#list").innerHTML = hits.length ? grouped(hits, rowFn)
      : `<div class="empty" style="margin-top:30px"><div class="ico emo" aria-hidden="true">🔍</div><strong>«${esc(raw)}» topilmadi</strong><p>Bu ro'yxatda bunday mahsulot yo'q.</p>
         <button class="btn primary" id="add-found"><i data-lucide="plus"></i>«${esc(raw)}» ni qo'shish</button></div>`;
    const add = $("#add-found");
    if (add) add.addEventListener("click", () => { openEditor(); setTimeout(() => { const n = $("#a-own"); if (n) { n.value = raw; n.dispatchEvent(new Event("input")); } }, 50); });
    icons();
    return;
  }
  if (view === "all") {
    html = `<div class="legend"><span><i style="background:var(--danger)"></i>Uyda yo'q — kerak</span><span><i style="background:var(--sage-soft);box-shadow:inset 0 0 0 1.5px #13774A"></i>Olingan</span>
      <button class="link-btn" id="history" style="margin-left:auto"><i data-lucide="history" style="width:14px;height:14px;vertical-align:-2px"></i> Tarix</button></div>`;
    html += items.length ? grouped(items, rowAll) : empty("Ro'yxat bo'sh", "Uyda doim bo'ladigan mahsulotlarni qo'shing. Tugaganida X ni bosasiz.", "🧺");
  } else if (view === "need") {
    html = need.length ? grouped(need, rowNeed) : empty("Hammasi bor! 🎉", "Hozircha hech narsa olish kerak emas. Mahsulot tugasa, «Hammasi» bo'limida X ni bosing.", "🥳");
  } else {
    html = bought.length ? `<div class="bar"><button class="btn ghost" id="restock-all"><i data-lucide="archive-restore"></i>Hammasi joylandi</button><button class="btn ghost" id="history2"><i data-lucide="history"></i>Xaridlar tarixi</button></div>` + grouped(bought, rowBought)
      : empty("Xarid qilinganlar yo'q", "Do'kondan olingan mahsulotlar shu yerda ko'rinadi.", "🛍️");
  }
  $("#list").innerHTML = html;
  if (fresh) {
    const r = $(`.g-row[data-id="${fresh.id}"]`);
    if (r) {
      if (fresh.t0 == null) fresh.t0 = performance.now();
      const elapsed = performance.now() - fresh.t0;
      if (elapsed < WOBBLE_MS) { r.style.animationDelay = `-${Math.round(elapsed)}ms`; r.classList.add("wobble-in"); }
      else fresh = null;
    }
  }
  icons();
  const h = $("#history") || $("#history2"); if (h) h.addEventListener("click", openHistory);
  const ra = $("#restock-all"); if (ra) ra.addEventListener("click", restockAll);
}

function empty(title, text, emoji) {
  return `<div class="empty" style="margin-top:30px"><div class="ico emo" aria-hidden="true">${emoji}</div><strong>${title}</strong><p>${text}</p>
    ${view === "all" ? `<button class="btn primary" onclick="openEditor()">Mahsulot qo'shish <span class="emo" aria-hidden="true">🛍️</span></button>` : ""}</div>`;
}

/* ---------- interactions ---------- */
$("#list").addEventListener("click", async (e) => {
  const row = e.target.closest(".g-row"); if (!row) return;
  const item = items.find((i) => i.id === row.dataset.id); if (!item) return;
  const me = Store.ctx.profile.id;
  if (e.target.closest("[data-x]")) {
    const btn = e.target.closest("[data-x]");
    const toNeed = item.status !== "kerak";
    // optimistic UI: instant visual feedback
    Object.assign(item, toNeed ? { status: "kerak", marked_by: me, marked_at: new Date().toISOString() } : { status: "bor" });
    btn.classList.toggle("on", toNeed); btn.classList.remove("done");
    row.classList.toggle("need", toNeed); row.classList.remove("bought");
    if (navigator.vibrate) navigator.vibrate(12);
    try {
      await Store.update("grocery_items", item.id, toNeed
        ? { status: "kerak", marked_by: me, marked_at: item.marked_at, purchased_by: null, purchased_at: null }
        : { status: "bor", marked_by: null, marked_at: null });
      if (toNeed) App.queueGrocery("grocery_need", item.name);
      else App.unqueueGrocery("grocery_need", item.name);
    } catch (err) { App.fail(err); }
    draw();
  } else if (e.target.closest("[data-buy]")) {
    const btn = e.target.closest("[data-buy]");
    btn.classList.add("on"); row.classList.add("leaving");
    if (navigator.vibrate) navigator.vibrate([10, 40, 10]);
    try {
      await Store.update("grocery_items", item.id, { status: "olindi", purchased_by: me, purchased_at: new Date().toISOString() });
      App.queueGrocery("grocery_bought", item.name);
    } catch (err) { App.fail(err); row.classList.remove("leaving"); btn.classList.remove("on"); }
  } else if (e.target.closest("[data-restock]")) {
    try { await Store.update("grocery_items", item.id, { status: "bor", marked_by: null, marked_at: null }); } catch (err) { App.fail(err); }
  } else if (e.target.closest("[data-edit]")) {
    openEditor(item);
  }
});

async function restockAll() {
  const bought = items.filter((i) => i.status === "olindi");
  try { await Promise.all(bought.map((i) => Store.update("grocery_items", i.id, { status: "bor", marked_by: null, marked_at: null }))); }
  catch (e) { return App.fail(e); }
  App.toast("Xaridlar uyga joylandi", "archive-restore");
  render();
}

/* ---------- 🎁 Xohishlar: ask the partner to bring a treat ---------- */
const WISH_KEY = () => "oila-wishes-" + App.today();
const wishesToday = () => { try { return +localStorage.getItem(WISH_KEY()) || 0; } catch (e) { return 0; } };
function drawGifts() {
  const partner = Store.ctx && Store.ctx.partner;
  const dear = Store.ctx && Store.ctx.profile.role === "er" ? "Oyijonisi" : "Dadajonisi";
  const who = partner ? App.firstName(partner) : dear;
  const n = wishesToday();
  $("#list").innerHTML = `<div class="gift-hero">
      <span class="floaty f1 emo" aria-hidden="true">🍭</span><span class="floaty f2 emo" aria-hidden="true">🍫</span><span class="floaty f3 emo" aria-hidden="true">💝</span>
      <h3>Nimadir shirin yegingiz kelyaptimi? 🥺</h3>
      <p>«Хочу» ni bosing — ${esc(who)} qaytishda olib keladi 💌</p>
      ${n ? `<span class="gift-sent" id="wish-count">Bugun ${n} ta xohish yuborildi 💕</span>` : `<span class="gift-sent" id="wish-count" hidden></span>`}
    </div>
    <div class="gifts">${Catalog.GIFTS.map((g, i) => `<div class="gift" style="--d:${(-i * 0.37).toFixed(2)}s"><span class="ge emo" aria-hidden="true">${g.emoji}</span><span class="gn">${esc(g.name)}</span>
      <button data-gift="${i}" aria-label="${esc(g.name)}: хочу">Хочу 🥺</button></div>`).join("")}</div>`;
}
function heartBurst(card) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  ["💖", "💕", "💗", "✨", "💝"].forEach((h, k) => {
    const el = document.createElement("span");
    el.className = "heart-fly emo"; el.textContent = h;
    el.style.setProperty("--x", `${(k - 2) * 22}px`); el.style.setProperty("--r", `${(k - 2) * 15}deg`);
    el.style.animationDelay = `${k * 60}ms`;
    card.appendChild(el); setTimeout(() => el.remove(), 1400);
  });
}
$("#list").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-gift]"); if (!b) return;
  const g = Catalog.GIFTS[+b.dataset.gift];
  if (!Store.ctx.partner) return App.toast("Avval juftingiz telefonini ulang: ⚙ → Qurilmani ulash", "smartphone");
  const card = b.closest(".gift");
  b.disabled = true; b.textContent = "Yuborildi 💌";
  card.classList.add("sent"); heartBurst(card);
  if (navigator.vibrate) navigator.vibrate([15, 40, 15, 40, 30]);
  try {
    await Store.notify("gift_wish", { gift: g.name, verb: g.verb }, "rozgor.html?view=gift");
    try { localStorage.setItem(WISH_KEY(), wishesToday() + 1); } catch (err) {}
    const c = $("#wish-count"); if (c) { c.hidden = false; c.textContent = `Bugun ${wishesToday()} ta xohish yuborildi 💕`; }
    App.toast(`${g.emoji} ${App.firstName(Store.ctx.partner)}ga yuborildi! Endi kutamiz 🥰`, "heart");
  } catch (err) { App.fail(err); }
  setTimeout(() => { b.disabled = false; b.textContent = "Хочу 🥺"; card.classList.remove("sent"); }, 4000);
});

/* ---------- Add products: name box on top (emoji on the left); a one-line category strip;
   tapping a product chip writes it into the name box (several, comma-separated) ---------- */
function openAdder() {
  let cat = CATS[0].id;
  const norm = (n) => Stickers.normalize(n);
  const stateOf = (name) => { const it = items.find((i) => norm(i.name) === norm(name)); return it ? it.status : null; };
  App.sheet({
    title: "Bugun nima kerak? 🛍️",
    body: `<div class="field"><label for="a-own">Mahsulot nomi</label>
        <div class="name-row"><span class="sticker lg sticker-preview" id="a-sticker" aria-hidden="true">🛒</span><input class="input" id="a-own" autocomplete="off" maxlength="200" placeholder="masalan, Sabzi, Piyoz" autofocus></div>
        <span class="hint">Pastdan tanlang yoki o'zingiz yozing. Bir nechta bo'lsa — vergul bilan.</span></div>
      <div class="step-label"><b>1</b>Turkum</div>
      <div class="cat-strip" id="a-cats" role="group" aria-label="Turkum"></div>
      <div class="step-label"><b>2</b>Mahsulotni tanlang</div>
      <div class="pick-chips" id="a-picks" role="group" aria-label="Mahsulotlar"></div>`,
    foot: `<button class="btn ghost" data-close>Bekor qilish</button><button class="btn primary" data-save disabled>Qo'shish</button>`,
    onMount(el, api) {
      const own = $("#a-own", el), save = $("[data-save]", el), stk = $("#a-sticker", el);
      const names = () => own.value.split(",").map((x) => x.trim()).filter(Boolean);
      const has = (n) => names().some((x) => norm(x) === norm(n));
      const refresh = () => {
        const list = names(), n = list.length;
        save.disabled = !n;
        save.innerHTML = n ? `Qo'shish${n > 1 ? ` (${n})` : ""} <span class="emo" aria-hidden="true">✨</span>` : "Qo'shish";
        const e = list.length ? emojiFor(list[list.length - 1], cat) : "🛒";
        if (stk.textContent !== e) { stk.textContent = e; stk.classList.remove("pop"); void stk.offsetWidth; stk.classList.add("pop"); }
        $$("[data-pick]", el).forEach((b) => b.setAttribute("aria-pressed", has(b.dataset.pick)));
      };
      const drawCats = () => {
        $("#a-cats", el).innerHTML = CATS.map((c) => `<button type="button" data-cat="${c.id}" aria-pressed="${c.id === cat}"><span class="emo" aria-hidden="true">${c.emoji}</span>${esc(c.name)}</button>`).join("");
      };
      const drawPicks = () => {
        $("#a-picks", el).innerHTML = Catalog.category(cat).products.map((x) => {
          const st = stateOf(x.name);
          return `<button type="button" data-pick="${esc(x.name)}" aria-pressed="${has(x.name)}" ${st === "kerak" ? "disabled" : ""}><span class="emo" aria-hidden="true">${x.emoji}</span>${esc(x.name)}${st === "kerak" ? " ✓" : ""}</button>`;
        }).join("");
      };
      drawCats(); drawPicks();
      $("#a-cats", el).addEventListener("click", (e) => {
        const b = e.target.closest("[data-cat]"); if (!b) return;
        cat = b.dataset.cat; drawCats(); drawPicks(); refresh();
        b.scrollIntoView({ inline: "nearest", block: "nearest" });
      });
      $("#a-picks", el).addEventListener("click", (e) => {
        const b = e.target.closest("[data-pick]"); if (!b || b.disabled) return;
        const n = b.dataset.pick;
        const list = names();
        own.value = (has(n) ? list.filter((x) => norm(x) !== norm(n)) : list.concat(n)).join(", ");
        refresh();
      });
      own.addEventListener("input", refresh);
      own.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); if (names().length) save.click(); } });
      save.addEventListener("click", async () => {
        const list = [];
        names().forEach((n) => { if (!list.some((x) => norm(x) === norm(n))) list.push(n); });
        if (!list.length) return;
        save.disabled = true;
        const me = Store.ctx.profile.id, now = new Date().toISOString();
        let added = 0;
        try {
          for (const typed of list) {
            const known = Catalog.find(typed);
            const name = known ? known.name : typed;
            const found = items.find((i) => norm(i.name) === norm(name));
            if (found && found.status === "kerak") continue;
            if (found) await Store.update("grocery_items", found.id, { status: "kerak", marked_by: me, marked_at: now, purchased_by: null, purchased_at: null });
            else {
              const row = await Store.insert("grocery_items", { name, category: known ? known.category : cat, quantity: "", note: "", urgent: false, status: "kerak", added_by: me, marked_by: me, marked_at: now });
              if (row && row.id) fresh = { id: row.id, t0: null };
            }
            App.queueGrocery("grocery_need", name);
            added++;
          }
          App.toast(added ? `${added === 1 ? `«${list[0]}»` : `${added} ta mahsulot`} «Kerak» ro'yxatiga qo'shildi 🛒` : "Bular allaqachon ro'yxatda ✓", "shopping-basket");
          api.close(); render();
        } catch (err) { App.fail(err); save.disabled = false; }
      });
    },
  });
}

function openEditor(item) {
  if (!item) return openAdder();
  const isNew = !item;
  const it = item || { name: "", category: "sabzavot", quantity: "", note: "", urgent: false, status: "kerak" };
  App.sheet({
    title: isNew ? "Bugun nima kerak? 🛍️" : "Mahsulotni tahrirlash ✏️",
    body: `<form id="gform" novalidate>
      <div class="field"><label for="g-name">Nomi</label>
        <div class="name-row"><span class="sticker lg sticker-preview" id="g-sticker" aria-hidden="true">${Stickers.forName(it.name, catOf(it.category).id)}</span><input class="input" id="g-name" name="name" value="${esc(it.name)}" autocomplete="off" autofocus required maxlength="60" placeholder="masalan, Sabzi"></div>
        <span class="error-text" hidden id="g-err">Mahsulot nomini yozing</span></div>
      <div class="field"><label for="g-cat">Turkum</label><select class="select" id="g-cat" name="category">${CATS.map((c) => `<option value="${c.id}" ${c.id === catOf(it.category).id ? "selected" : ""}>${c.emoji} ${c.name}</option>`).join("")}</select></div>
      <div class="field-row">
        <div class="field"><label for="g-qty">Miqdori</label><input class="input" id="g-qty" name="quantity" value="${esc(it.quantity)}" placeholder="masalan, 2 kg" maxlength="30"></div>
        <div class="field"><label for="g-note">Izoh</label><input class="input" id="g-note" name="note" value="${esc(it.note)}" maxlength="80"></div>
      </div>
      <label class="switch"><span><b style="font-weight:600">Shoshilinch</b><br><span class="hint">Ro'yxat tepasida qizil belgi bilan</span></span><input type="checkbox" name="urgent" ${it.urgent ? "checked" : ""}></label>
      ${isNew ? `<label class="switch"><span><b style="font-weight:600">Hozir kerak</b><br><span class="hint">O'chirilsa, uyda bor deb saqlanadi</span></span><input type="checkbox" name="needed" checked></label>` : ""}
      ${!isNew && it.added_by ? `<p class="hint" style="margin-top:12px">${esc(App.nameOf(it.added_by))} qo'shgan${it.purchased_by ? ` · oxirgi marta ${esc(App.nameOf(it.purchased_by))} olgan` : ""}</p>` : ""}
    </form>`,
    foot: `${isNew ? `<button class="btn ghost" data-close>Bekor qilish</button>` : `<button class="btn danger" data-del><i data-lucide="trash-2"></i>O'chirish</button>`}<button class="btn primary" data-save>${isNew ? `Qo'shish <span class="emo" aria-hidden="true">✨</span>` : "Saqlash"}</button>`,
    onMount(el, api) {
      const f = $("#gform", el);
      const name = f.elements.name;
      name.addEventListener("blur", () => { if (!name.value.trim()) $("#g-err", el).hidden = false; });
      name.addEventListener("input", () => { $("#g-err", el).hidden = true; });
      // Live sticker preview: wiggles each time the emoji changes.
      const prev = $("#g-sticker", el);
      const preview = () => {
        const e = Stickers.forName(name.value, f.elements.category.value);
        if (prev.textContent === e) return;
        prev.textContent = e; prev.classList.remove("pop"); void prev.offsetWidth; prev.classList.add("pop");
      };
      name.addEventListener("input", preview);
      f.elements.category.addEventListener("change", preview);
      const save = async () => {
        const v = { name: name.value.trim(), category: f.elements.category.value, quantity: f.elements.quantity.value.trim(), note: f.elements.note.value.trim(), urgent: f.elements.urgent.checked };
        if (!v.name) { $("#g-err", el).hidden = false; name.focus(); return; }
        const me = Store.ctx.profile.id;
        $("[data-save]", el).disabled = true;
        try {
          if (isNew) {
            const needed = f.elements.needed.checked;
            const row = await Store.insert("grocery_items", { ...v, status: needed ? "kerak" : "bor", added_by: me, marked_by: needed ? me : null, marked_at: needed ? new Date().toISOString() : null });
            fresh = row && row.id ? { id: row.id, t0: null } : null;
            if (needed) App.queueGrocery("grocery_need", v.name);
            else Store.logActivity("grocery_added", { item: v.name });
            App.toast(`${Stickers.forName(v.name, v.category)} «${v.name}» qo'shildi`);
          } else {
            await Store.update("grocery_items", it.id, v);
            App.toast("Saqlandi");
          }
          api.close(); render();
        } catch (e) { App.fail(e); $("[data-save]", el).disabled = false; }
      };
      f.addEventListener("submit", (e) => { e.preventDefault(); save(); });
      $("[data-save]", el).addEventListener("click", save);
      const del = $("[data-del]", el);
      if (del) del.addEventListener("click", async () => {
        api.close();
        if (!(await App.confirm(`«${it.name}» ro'yxatdan butunlay o'chiriladi.`, "Mahsulotni o'chirish"))) return;
        try { await Store.remove("grocery_items", it.id); App.toast("O'chirildi", "trash-2"); render(); } catch (e) { App.fail(e); }
      });
    },
  });
}
window.openEditor = openEditor;

async function openHistory() {
  const acts = (await Store.list("activity", { limit: 200 })).filter((a) => a.module === "grocery");
  App.sheet({
    title: "Xaridlar tarixi",
    body: acts.length ? `<div class="list">${acts.map((a) => `<div class="row" style="padding:10px 0">${App.avatar(App.person(a.actor_id), "sm")}<div class="grow"><div style="font-size:14px">${esc(a.text)}</div><div class="meta">${App.timeAgo(a.created_at)}</div></div></div>`).join("")}</div>`
      : `<div class="empty"><div class="ico emo" aria-hidden="true">📜</div><strong>Tarix bo'sh</strong><p>Belgilangan va olingan mahsulotlar shu yerda yoziladi.</p></div>`,
  });
}

$$(".segmented button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
$("#add").addEventListener("click", () => openEditor());
$("#q").addEventListener("input", (e) => {
  query = Stickers.normalize(e.target.value);
  $("#q-clear").hidden = !e.target.value;
  draw();
});
$("#q-clear").addEventListener("click", () => { const q = $("#q"); q.value = ""; q.dispatchEvent(new Event("input")); q.focus(); });
setView(view);
App.boot({ page: "rozgor", title: "Ro'zg'or", emoji: "🛒", sub: "Uyda nima yo'q — darhol ko'rinadi", tables: ["grocery_items"], render }).then(() => {
  if (new URLSearchParams(location.search).get("new")) openEditor();
});
</script>
