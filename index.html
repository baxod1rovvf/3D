<!doctype html>
<html lang="uz">
<head>
<title>Oila Uchun</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="js/config.js"></script>
<script src="js/stickers.js"></script>
<script src="js/catalog.js"></script>
<script src="js/messages.js"></script>
<script src="js/reminders.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<style>
  .hello { margin-top: 2px; }
  .hello h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 29px; line-height: 1.15; }
  .hello p { margin: 4px 0 0; color: var(--ink-2); font-weight: 700; }
  .overview { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ov { padding: 14px; display: flex; flex-direction: column; gap: 8px; min-height: 128px; background: var(--accent-soft); border-color: transparent; box-shadow: 0 4px 0 var(--accent); transition: transform var(--t-fast) var(--bounce); }
  .ov:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent); }
  .ov .ov-ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; flex: none; background: #fff; font-size: 22px; line-height: 1; box-shadow: 0 2px 0 rgba(43, 36, 64, .08); }
  .ov .num { font-family: var(--display); font-size: 34px; font-weight: 600; line-height: 1; color: var(--ink); }
  .ov .lbl { font-size: 13px; font-weight: 700; color: var(--ink-2); }
  .ov .val { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
  .ov.wide { grid-column: span 2; min-height: 0; flex-direction: row; align-items: center; gap: 12px; }
  .ov .go { width: 20px; height: 20px; color: var(--accent-ink); flex: none; }
  .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .qa { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 8px 2px; font-size: 12px; font-weight: 800; text-align: center; color: var(--ink-2); line-height: 1.2; min-height: 44px; }
  .qa span.i { width: 56px; height: 56px; border-radius: 20px; background: var(--accent-soft); border: 2px solid #fff; display: grid; place-items: center; font-size: 26px; line-height: 1; box-shadow: 0 0 0 2px var(--accent), 0 4px 0 2px var(--accent); transition: transform var(--t-fast) var(--bounce); }
  .qa:active span.i { transform: scale(.9) rotate(-6deg); }
  .act { gap: 10px; }
  .act .who { flex: none; }
  .act .sticker { margin: -4px 0; }
</style>
</head>
<body>
<div class="app" data-section="home">
  <main class="main" id="main">
    <div class="hello">
      <h1 id="greet">&nbsp;</h1>
      <p id="today">&nbsp;</p>
    </div>

    <section class="section" aria-labelledby="ov-h">
      <div class="section-head"><h2 id="ov-h">Bugun <span class="emo" aria-hidden="true">☀️</span></h2></div>
      <div class="overview" id="overview">
        <div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div>
        <div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div>
      </div>
    </section>

    <section class="section" aria-labelledby="qa-h">
      <div class="section-head"><h2 id="qa-h">Tezkor amallar <span class="emo" aria-hidden="true">⚡</span></h2></div>
      <div class="actions">
        <a class="qa" data-section="rozgor" href="rozgor.html?new=1"><span class="i emo" aria-hidden="true">🛒</span>Mahsulot qo'shish</a>
        <a class="qa" data-section="taomlar" href="taomlar.html?new=1"><span class="i emo" aria-hidden="true">🍲</span>Taom qo'shish</a>
        <a class="qa" data-section="uy-ishlari" href="uy-ishlari.html?new=1"><span class="i emo" aria-hidden="true">🧹</span>Ish qo'shish</a>
        <a class="qa" data-section="xotiralar" href="xotiralar.html?new=1"><span class="i emo" aria-hidden="true">📸</span>Xotira saqlash</a>
      </div>
    </section>

    <section class="section" aria-labelledby="act-h">
      <div class="section-head"><h2 id="act-h">So'nggi faollik <span class="emo" aria-hidden="true">💬</span></h2></div>
      <div class="card list" id="activity"></div>
    </section>
  </main>
</div>

<script>
const { $, esc, icons } = App;

async function render(ctx) {
  $("#greet").textContent = `${App.greeting()}, ${App.firstName(ctx.profile)} 👋`;
  $("#today").textContent = App.fmtLong(new Date());

  const [items, meals, tasks, acts] = await Promise.all([
    Store.list("grocery_items"), Store.list("meals"), Store.list("tasks"), Store.list("activity", { limit: 8 }),
  ]);
  const t = App.today();
  const need = items.filter((i) => i.status === "kerak");
  const urgent = need.filter((i) => i.urgent).length;

  const slots = ["nonushta", "tushlik", "kechki"];
  const slotName = { nonushta: "Nonushta", tushlik: "Tushlik", kechki: "Kechki ovqat" };
  const h = new Date().getHours();
  const todays = meals.filter((m) => m.day_date === t).sort((a, b) => slots.indexOf(a.slot) - slots.indexOf(b.slot));
  const nextSlot = h < 11 ? 0 : h < 16 ? 1 : 2;
  const meal = todays.find((m) => slots.indexOf(m.slot) >= nextSlot) || todays[todays.length - 1];

  const pending = tasks.filter((x) => !x.done && x.due_date && x.due_date <= t);
  const mine = pending.filter((x) => App.isMe(x.assignee_id)).length;
  const reminders = tasks.filter((x) => !x.done && ((x.remind_at && new Date(x.remind_at) > new Date()) || (x.due_date && x.due_date > t && x.due_date <= App.addDays(t, 3))))
    .sort((a, b) => (a.remind_at || a.due_date) > (b.remind_at || b.due_date) ? 1 : -1);

  $("#overview").innerHTML = `
    <a class="card ov" data-section="rozgor" href="rozgor.html">
      <span class="ov-ico emo" aria-hidden="true">🛒</span>
      <span class="num">${need.length}</span>
      <span class="lbl">ta mahsulot kerak${urgent ? ` · <b style="color:var(--danger-ink)">${urgent} shoshilinch</b>` : ""}</span>
    </a>
    <a class="card ov" data-section="uy-ishlari" href="uy-ishlari.html">
      <span class="ov-ico emo" aria-hidden="true">🧹</span>
      <span class="num">${pending.length}</span>
      <span class="lbl">ta uy ishi kutmoqda${mine ? ` · ${mine} tasi sizda` : ""}</span>
    </a>
    <a class="card ov wide" data-section="taomlar" href="taomlar.html">
      <span class="ov-ico emo" aria-hidden="true">${meal ? { nonushta: "🍳", tushlik: "🍲", kechki: "🌙" }[meal.slot] || "🍲" : "🍽️"}</span>
      <span class="grow" style="flex:1;min-width:0">
        <span class="lbl">${meal ? slotName[meal.slot] : "Bugungi taom"}</span><br>
        <span class="val">${meal ? esc(meal.title) : "Hali rejalashtirilmagan"}</span>
      </span>
      <i data-lucide="chevron-right" class="go"></i>
    </a>
    <a class="card ov wide" data-section="home" href="uy-ishlari.html">
      <span class="ov-ico emo" aria-hidden="true">⏰</span>
      <span class="grow" style="flex:1;min-width:0">
        <span class="lbl">Yaqin eslatmalar</span><br>
        <span class="val">${reminders.length ? esc(reminders[0].title) + ` <span class="muted small" style="font-weight:400">· ${App.fmtShort(reminders[0].remind_at ? App.ymd(new Date(reminders[0].remind_at)) : reminders[0].due_date)}</span>` : "Eslatma yo'q"}</span>
        ${reminders.length > 1 ? `<span class="small muted">yana ${reminders.length - 1} ta</span>` : ""}
      </span>
      <i data-lucide="chevron-right" class="go"></i>
    </a>`;

  const ICON = { grocery: "shopping-basket", meals: "utensils", memories: "heart", tasks: "sparkles" };
  // A grocery activity names its product in «…»: show that product's sticker.
  const productSticker = (a) => {
    const m = a.module === "grocery" && /«([^»]+)»/.exec(a.text || "");
    return m ? `<span class="sticker sm" data-section="rozgor" aria-hidden="true">${Stickers.forName(m[1], "boshqa")}</span>` : "";
  };
  $("#activity").innerHTML = acts.length ? acts.map((a) => `
    <div class="row act">
      <span class="who">${App.avatar(App.person(a.actor_id), "sm")}</span>
      <div class="grow"><div style="font-size:14px;font-weight:600">${esc(a.text)}</div><div class="meta"><i data-lucide="${ICON[a.module] || "dot"}" style="width:12px;height:12px"></i>${App.timeAgo(a.created_at)}</div></div>
      ${productSticker(a)}
    </div>`).join("")
    : `<div class="empty"><div class="ico emo" aria-hidden="true">🏡</div><strong>Uyingiz endi jonlanadi</strong><p>Birinchi mahsulot yoki ishni qo'shing — juftingiz darhol ko'radi.</p><a class="btn primary" href="rozgor.html?new=1">Mahsulot qo'shish <span class="emo" aria-hidden="true">🛍️</span></a></div>`;
  icons();
}

App.boot({ page: "home", home: true, tables: ["grocery_items", "meals", "tasks", "activity"], render });
</script>
</body>
</html>
